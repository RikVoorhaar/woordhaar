[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woordhaar"
version = "0.1.0"
description = "Cross-lingual dictionary for Danish, Dutch, and English"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = []

[project.scripts]
woordhaar-ingest = "backend.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
